name: Release

on:
  push:
    tags: ['v*']
  # A PR that touches the release pipeline or the launchers builds and smoke-tests all
  # binaries; the release job only runs for tags, so nothing is published.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'src/Dataverse.Server/*.csproj'
  workflow_dispatch:

# Creating the release and uploading its assets needs write access to repository
# contents. Declared here rather than relying on the repository default, which is
# read-only for new repositories - the job then builds fine and fails at the last
# step with 403 'Resource not accessible by integration'.
permissions:
  contents: write
  # NuGet Trusted Publishing: the job exchanges a GitHub OIDC token for a short-lived
  # nuget.org API key, so no long-lived NUGET_API_KEY secret is stored anywhere.
  id-token: write

jobs:
  # --- MCP server binaries (self-contained, single file), one per platform ---
  # Release assets are RID-suffixed (DataverseMcp-<rid>[.exe]); the launcher picks the
  # one for its platform and normalises the on-disk name.
  # macOS binaries are built on a macOS runner: Apple Silicon refuses to start an
  # unsigned binary ("Killed: 9"), and only a Mac can ad-hoc sign it.
  binaries:
    strategy:
      matrix:
        include:
          - { rid: win-x64,   os: ubuntu-latest, asset: DataverseMcp-win-x64.exe, built: Dataverse.Server.exe }
          - { rid: linux-x64, os: ubuntu-latest, asset: DataverseMcp-linux-x64,   built: Dataverse.Server }
          - { rid: osx-arm64, os: macos-latest,  asset: DataverseMcp-osx-arm64,   built: Dataverse.Server }
          - { rid: osx-x64,   os: macos-latest,  asset: DataverseMcp-osx-x64,     built: Dataverse.Server }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/Dataverse.Server -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish
          mkdir -p ./out
          cp "./publish/${{ matrix.built }}" "./out/${{ matrix.asset }}"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "./out/${{ matrix.asset }}" && codesign --verify "./out/${{ matrix.asset }}"

      # Start the binary on its own platform and ask for initialize + tools/list.
      # win-x64 is cross-built on Linux and cannot run here.
      - name: Smoke test
        if: matrix.rid != 'win-x64'
        run: python3 .github/scripts/smoke_mcp.py 100 "./out/${{ matrix.asset }}"

      # The plugin's real start path on this OS: scripts/launch -> run-server.sh ->
      # binary-common.sh picks the asset name for the platform. The binary is pre-placed
      # where the launcher expects it, so the fast path runs without a download.
      - name: Smoke test through the plugin launcher
        if: matrix.rid != 'win-x64'
        run: |
          VERSION="$(tr -d '[:space:]' < scripts/BINARY_VERSION)"
          DATA="$RUNNER_TEMP/plugin-data"
          mkdir -p "$DATA/bin/$VERSION"
          cp "./out/${{ matrix.asset }}" "$DATA/bin/$VERSION/DataverseMcp"
          python3 .github/scripts/smoke_mcp.py 100 ./scripts/launch "$PWD" "$DATA"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ./out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Guard: all three version files must agree with the tag.
      #  - scripts/BINARY_VERSION: the SessionStart hook and the MCP launcher download the
      #    binary from releases/download/v<BINARY_VERSION>/... — a mismatch resolves a
      #    non-existent asset (the 0.0.0 bug).
      #  - Dataverse.Setup.csproj: the version of the published NuGet tool.
      #  - .claude-plugin/plugin.json: the version users see. It used to run on a separate
      #    track, so "plugin 0.18.1" said nothing about which binary was inside.
      - name: Verify all versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BINVER="$(tr -d '[:space:]' < scripts/BINARY_VERSION)"
          SETUPVER="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Dataverse.Setup/Dataverse.Setup.csproj | head -1 | tr -d '[:space:]')"
          PLUGINVER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          echo "Tag=$TAG  BINARY_VERSION=$BINVER  Setup.csproj=$SETUPVER  plugin.json=$PLUGINVER"
          FAIL=0
          for pair in "scripts/BINARY_VERSION:$BINVER" \
                      "src/Dataverse.Setup/Dataverse.Setup.csproj:$SETUPVER" \
                      ".claude-plugin/plugin.json:$PLUGINVER"; do
            file="${pair%%:*}"
            got="${pair#*:}"
            if [ "$got" != "$TAG" ]; then
              echo "::error file=$file::$file has version '$got' but the release tag is '$TAG'. Bump all three to the same value before tagging."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      # --- NuGet tool (Dataverse.Setup) ---
      - run: dotnet pack src/Dataverse.Setup -c Release -o ./artifacts

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/DataverseMcp-*

      # --- Publish the NuGet tool via Trusted Publishing ---
      # Runs after the GitHub release on purpose: the launcher downloads the binary from that
      # release, so a NuGet problem must never keep it from being created.
      # Optional — runs only when the repository variable NUGET_USER (the nuget.org profile
      # name, not the e-mail address) is set and nuget.org has a matching Trusted Publishing
      # policy for this repository and release.yml. See docs/GH-RELEASE-SETUP.md.
      - name: NuGet login (OIDC → short-lived API key)
        if: vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push NuGet package
        if: vars.NUGET_USER != ''
        run: >-
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
